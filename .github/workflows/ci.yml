name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build, test, lint (kernel + host + light transforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # chord's engine plug-ins link heavy native libraries (llama.cpp,
      # whisper.cpp, ONNX Runtime, sherpa-onnx, stable-diffusion.cpp), and the
      # multimodal `chat` engine path-deps an out-of-tree mistral.rs checkout.
      # This job validates the pure-Rust kernel, host, and light transforms;
      # the native-backed engines have their own matrix job below. The
      # multimodal `chat` engine path-deps an out-of-tree mistral.rs, so drop it
      # from the workspace so resolution doesn't require the sibling repo.
      - name: Trim workspace to CI-buildable crates
        run: sed -i '\#"crates/transforms/chord-chat",#d' Cargo.toml

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: >
          cargo fmt
          -p chord-core -p chord-runner -p chord-hf
          -p chord-cli -p chord-pack -p chord-unpack
          -- --check

      - name: Clippy
        run: >
          cargo clippy
          -p chord-core -p chord-runner -p chord-hf
          -p chord-cli -p chord-pack -p chord-unpack
          -- -D warnings

      - name: Build
        run: >
          cargo build --verbose
          -p chord-core -p chord-runner -p chord-hf
          -p chord-cli -p chord-pack -p chord-unpack

      - name: Test
        run: cargo test --verbose -p chord-core -p chord-pack -p chord-unpack

  engines:
    name: link ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      # Build every backend even if one fails, so a red X points at the engine.
      fail-fast: false
      matrix:
        include:
          - backend: whisper.cpp
            crates: "-p chord-stt"
          - backend: llama.cpp
            crates: "-p chord-text -p chord-see -p chord-stt-llama"
          - backend: onnxruntime
            crates: "-p chord-tts -p chord-redact"
          - backend: stable-diffusion.cpp
            crates: "-p chord-draw"
          - backend: sherpa-onnx
            crates: "-p chord-stt-sherpa -p chord-diarize -p chord-vad -p chord-langid"
    steps:
      - uses: actions/checkout@v4

      # Same reason as the build job: drop the mistral.rs-backed chat engine so
      # workspace resolution doesn't need the sibling repo.
      - name: Trim workspace
        run: sed -i '\#"crates/transforms/chord-chat",#d' Cargo.toml

      # cmake + a C/C++ compiler build llama.cpp / whisper.cpp / sd.cpp from the
      # vendoring -sys crates; libclang is for their bindgen. ort and sherpa-rs
      # download prebuilt libraries at build time.
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}

      - name: Build (link against ${{ matrix.backend }})
        run: cargo build --verbose ${{ matrix.crates }}
