    "crates/chord-runner",
    "crates/chord-hf",
    "crates/chord-cli",
    "crates/transforms/chord-stt",
    "crates/transforms/chord-stt-llama",
    "crates/transforms/chord-stt-sherpa",
    "crates/transforms/chord-diarize",
    "crates/transforms/chord-vad",
