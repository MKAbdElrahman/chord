[package]
name = "chord-cli"
description = "chord CLI host and composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chord"
path = "src/main.rs"

[dependencies]
# The host links no engine — each runs out-of-process via an exec-proxy
# (see src/proxy.rs), spawned as a sibling `chord-<name>` binary.
chord-core = { path = "../chord-core" }
chord-hf = { path = "../chord-hf" }
clap = "4"
serde = "1"
serde_yaml_ng = "0.10"
# `chord pull` downloads default models with a progress bar.
ureq = "2"
indicatif = "0.18"
