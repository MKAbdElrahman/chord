[package]
name = "chord-core"
description = "chord microkernel: data kinds, the Transform plug-in contract, and a registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The kernel links no *engine* code (the rule that keeps the dual-ggml symbol
# clash out of the host). These are tiny, pure-Rust utility crates with no native
# build scripts, so they never emit `cargo:rustc-link-lib` and are safe everywhere.
[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
directories = "5"

[dev-dependencies]
serde_json = "1"
