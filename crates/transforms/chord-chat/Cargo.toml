[package]
name = "chord-chat"
description = "chord multimodal chat plug-in (mistral.rs): text/image/audio -> text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chord-chat"
path = "src/main.rs"

[dependencies]
chord-core = { path = "../../chord-core" }
chord-runner = { path = "../../chord-runner" }
# Multimodal backend. Path dep into the sibling mistral.rs checkout; this engine
# is a separate out-of-process binary, so the candle/ggml it pulls in never
# touches the host or the llama.cpp engines.
mistralrs = { path = "../../../../mistral.rs/mistralrs" }
tokio = { version = "1.49", features = ["rt-multi-thread"] }
# Must resolve to the SAME 0.25.x as mistral.rs so `DynamicImage` is one type.
image = "0.25"
