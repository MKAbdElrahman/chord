[package]
name = "chord-vad"
description = "chord voice-activity-detection transform (sherpa-onnx / Silero): audio -> speech segment timestamps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chord-vad"
path = "src/main.rs"

[dependencies]
chord-core = { path = "../../chord-core" }
chord-runner = { path = "../../chord-runner" }
chord-hf = { path = "../../chord-hf" }
sherpa-rs = "0.6"
hound = "3"
